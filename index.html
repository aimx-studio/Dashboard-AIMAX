<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIMAX — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --black:#000;--black2:#0a0a0a;--black3:#111;--black4:#1a1a1a;--black5:#242424;
  --gold:#D4AF37;--gold2:#f0cc55;--gold3:#a88a20;
  --white:#fff;--grey:#888;--grey2:#555;--red:#e05252;--green:#52c07a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}

body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 50%,rgba(212,175,55,.04) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 20%,rgba(212,175,55,.03) 0%,transparent 50%);
}

.login-card{
  width:100%;max-width:400px;padding:52px 44px;
  border:1px solid var(--black5);background:var(--black2);
  position:relative;animation:fadeUp .5s ease forwards;
  margin:20px;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.login-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.2),transparent);
}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:44px;gap:6px}
.brand img{width:180px;margin-bottom:6px}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:8px;color:var(--gold);line-height:1}
.brand-tagline{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}

.field{margin-bottom:16px}
.field-label{display:block;font-size:10px;letter-spacing:2px;color:var(--grey);margin-bottom:8px;text-transform:uppercase}
.field-input{
  width:100%;background:var(--black4);border:1px solid var(--black5);
  color:var(--white);font-family:'JetBrains Mono',monospace;
  font-size:15px;letter-spacing:3px;padding:14px 16px;
  outline:none;transition:border-color .2s ease;border-radius:2px;
}
.field-input:focus{border-color:var(--gold)}
.field-input::placeholder{color:var(--grey2);letter-spacing:2px}

.btn-login{
  width:100%;margin-top:8px;padding:15px;
  background:var(--gold);color:var(--black);border:none;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:4px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background .2s ease,transform .1s;border-radius:2px;
}
.btn-login:hover{background:var(--gold2)}
.btn-login:active{transform:scale(.98)}
.btn-login svg{transition:transform .2s}
.btn-login:hover svg{transform:translateX(4px)}

.btn-login.loading{pointer-events:none;opacity:.8}
.btn-login.loading .btn-text{display:none}
.btn-login.loading::after{content:'...';letter-spacing:4px}

.login-error{
  margin-top:14px;padding:10px 14px;
  background:rgba(224,82,82,.08);border:1px solid rgba(224,82,82,.2);
  color:var(--red);font-size:12px;text-align:center;
  display:none;border-radius:2px;
}
.login-error.visible{display:block}

.footer-brand{
  position:absolute;bottom:16px;left:0;right:0;
  text-align:center;font-size:9px;letter-spacing:2px;
  color:var(--grey2);text-transform:uppercase;
}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;display:none}
.btn-login.loading .spinner{display:block}
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <div class="brand">
    <img src="logo.png" onerror="this.style.display='none'" alt="Logo">
    <div class="brand-name">AIMAX</div>
    <div class="brand-tagline">Restaurant Intelligence</div>
  </div>

  <div class="field">
    <label class="field-label">Usuario</label>
    <input type="text" id="userInput" class="field-input" placeholder="tu_usuario"
      autocomplete="off" autocapitalize="none" spellcheck="false"
      onkeydown="if(event.key==='Enter')document.getElementById('passInput').focus()"/>
  </div>

  <div class="field">
    <label class="field-label">Contraseña</label>
    <input type="password" id="passInput" class="field-input" placeholder="••••••••"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter')handleLogin()"/>
  </div>

  <button class="btn-login" id="btnLogin" onclick="handleLogin()">
    <span class="btn-text">INGRESAR</span>
    <div class="spinner"></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-text"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>

  <div class="login-error" id="loginError">Usuario o contraseña incorrectos</div>

  <div class="footer-brand">powered by AIMAX Studio</div>
</div>

<script>
/* ══════════════════════════════════
   AIMAX — Login Central
   Conecta con tabla aimax_clientes en Supabase
══════════════════════════════════ */

// ── TUS CREDENCIALES DE SUPABASE (el proyecto donde está aimax_clientes) ──
const AIMAX_SB_URL = 'https://hotryxyvbdbizfivgfft.supabase.co';       // 👈 cambia esto
const AIMAX_SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvdHJ5eHl2YmRiaXpmaXZnZmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDk1MDMsImV4cCI6MjA5MjM4NTUwM30.e_8rXHLVKl8gGH7r65LzCbXpLVygnHJf3lSvYXqosfw';                       // 👈 cambia esto
const AIMAX_TABLE  = 'aimax_clientes';

async function handleLogin() {
  const usuario = document.getElementById('userInput').value.trim().toLowerCase();
  const password = document.getElementById('passInput').value;
  const btn = document.getElementById('btnLogin');
  const errorEl = document.getElementById('loginError');

  if (!usuario || !password) {
    showError('Completa usuario y contraseña');
    return;
  }

  // Loading state
  btn.classList.add('loading');
  errorEl.classList.remove('visible');

  try {
    // Consultar aimax_clientes en Supabase
    const url = `${AIMAX_SB_URL}/rest/v1/${AIMAX_TABLE}?usuario=eq.${encodeURIComponent(usuario)}&select=*&limit=1`;
    const res = await fetch(url, {
      headers: {
        'apikey': AIMAX_SB_KEY,
        'Authorization': `Bearer ${AIMAX_SB_KEY}`,
        'Content-Type': 'application/json'
      }
    });

    if (!res.ok) throw new Error('Error de conexión con la base de datos');

    const data = await res.json();

    if (!data.length) {
      showError('Usuario o contraseña incorrectos');
      btn.classList.remove('loading');
      return;
    }

    const cliente = data[0];

    // Verificar contraseña
    if (cliente.password !== password) {
      showError('Usuario o contraseña incorrectos');
      shake();
      btn.classList.remove('loading');
      return;
    }

    // Verificar que esté activo
    if (cliente.activo === false) {
      showError('Tu cuenta está desactivada. Contacta a AIMAX.');
      btn.classList.remove('loading');
      return;
    }

    // Guardar datos del cliente en sessionStorage
    sessionStorage.setItem('aimax_sb_url',    cliente.sb_url);
    sessionStorage.setItem('aimax_sb_key',    cliente.sb_key);
    sessionStorage.setItem('aimax_sb_table',  cliente.sb_table || 'pedidos');
    sessionStorage.setItem('aimax_name',      cliente.restaurante);
    sessionStorage.setItem('aimax_usuario',   cliente.usuario);
    sessionStorage.setItem('aimax_plan',      cliente.plan);

    // Redirigir según el plan
    if (cliente.plan === 'max') {
      window.location.href = 'max.html';
    } else {
      window.location.href = 'medio.html';
    }

  } catch (err) {
    console.error(err);
    showError('Error de conexión. Intenta de nuevo.');
    btn.classList.remove('loading');
  }
}

function showError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.add('visible');
}

function shake() {
  const card = document.getElementById('loginCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'shake .3s ease';
}
</script>
</body>
</html>
